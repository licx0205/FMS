<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>殡葬管理系统</title>
  <script src="./libs/vue.global.prod.js"></script>
  <style>
    :root {
      /* 黑白灰主题 */
      --bg: #f5f5f5;
      --bg-dark: #e0e0e0;
      --panel: #ffffff;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --primary: #1a1a1a;
      --primary-dark: #000000;
      --accent: #9e9e9e;
      --danger: #4a4a4a;
      --danger-dark: #2a2a2a;
      --ok: #3a3a3a;
      --line: #c9c9c9;
      --shadow: 4px 4px 0 0 #d0d0d0;
      --shadow-sm: 2px 2px 0 0 #d0d0d0;
      --ui-font: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--ui-font);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ===== 通用控件（像素风硬阴影 + 圆角）===== */
    .pixel-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .pixel-btn {
      display: inline-block;
      font-family: var(--ui-font);
      font-weight: 500;
      font-size: 13px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border: 1px solid #7c7c7c;
      box-shadow: 3px 3px 0 0 #000;
      cursor: pointer;
      letter-spacing: .5px;
      border-radius: 8px;
      transition: transform .05s, box-shadow .05s, background .15s;
    }
    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 0 #000;
    }
    .pixel-btn.primary { background: var(--primary); color: #fff; border-color: #000; }
    .pixel-btn.primary:hover { background: var(--primary-dark); }
    .pixel-btn.danger { background: var(--danger); color: #fff; border-color: #1a1a1a; }
    .pixel-btn.danger:hover { background: var(--danger-dark); }
    .pixel-btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); box-shadow: 2px 2px 0 0 #b5b5b5; }
    .pixel-btn.ghost:hover { background: #f0f0f0; }
    .pixel-btn:disabled { opacity: .5; cursor: not-allowed; }
    .pixel-btn.mini { padding: 4px 10px; font-size: 12px; margin-right: 4px; }

    .status-tag {
      display: inline-block;
      padding: 2px 10px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }
    .status-tag.ok { background: #4caf50; color: #fff; border-color: #388e3c; }
    .status-tag.warn { background: #ff9800; color: #fff; border-color: #f57c00; }
    .status-tag.off { background: #9e9e9e; color: #fff; border-color: #757575; }

    /* ===== 灵车预约看板 ===== */
    .board-title { font-weight: 700; margin: 0 8px; font-size: 15px; }
    .board-wrap { overflow-x: auto; margin-top: 12px; }
    .board { width: 100%; border-collapse: collapse; font-size: 13px; }
    .board th, .board td {
      border: 1px solid var(--line);
      padding: 6px;
      text-align: center;
      background: #fff;
      min-width: 72px;
    }
    .board th.corner { min-width: 130px; text-align: left; background: #f5f5f5; }
    .board th.today, .board td.today { background: #fff7e6; }
    .board .d-week { font-size: 11px; color: #888; }
    .board .d-day { font-size: 14px; font-weight: 700; }
    .board .h-name { text-align: left; font-weight: 700; background: #fafafa; }
    .board .h-plate { font-weight: 700; }
    .board .h-model { font-size: 11px; color: #999; font-weight: 400; }
    .cell-empty { height: 34px; border-radius: 6px; }
    .cell-booked {
      height: 34px;
      display: flex; align-items: center; justify-content: center;
      background: #ffcdd2; color: #b71c1c;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: default;
    }
    .res-list-title { font-weight: 700; margin: 20px 0 8px; font-size: 15px; }

    .pixel-input, .pixel-select {
      width: 100%;
      font-family: var(--ui-font);
      font-size: 14px;
      padding: 9px 12px;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: inset 2px 2px 0 0 #ececec;
      outline: none;
      border-radius: 8px;
    }
    .pixel-input:focus, .pixel-select:focus {
      border-color: var(--primary);
      box-shadow: 3px 3px 0 0 #000;
    }
    .pixel-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
      letter-spacing: .5px;
    }

    /* ===== 登录页 ===== */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }
    .login-card {
      background: var(--panel);
      border: 1px solid var(--ink);
      box-shadow: 6px 6px 0 0 #000;
      padding: 36px;
      width: 380px;
      max-width: 92vw;
      text-align: center;
      border-radius: 12px;
    }
    .login-title { font-size: 20px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
    .login-sub { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin-bottom: 24px; }
    .login-card .field { text-align: left; margin-bottom: 16px; }
    .login-card .pixel-btn { width: 100%; margin-top: 6px; }
    .remember-row { text-align: left; margin-bottom: 14px; }
    .remember-label {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; cursor: pointer; user-select: none; color: #1a1a1a;
    }
    .pixel-check {
      appearance: none; width: 16px; height: 16px;
      border: 1px solid var(--line); border-radius: 4px;
      background: #fff; cursor: pointer; position: relative;
    }
    .pixel-check:checked { background: var(--primary); border-color: var(--primary); }
    .pixel-check:checked::after {
      content: "✓"; position: absolute; top: -2px; left: 2px;
      font-size: 12px; color: #fff; font-weight: 700;
    }
    .err { color: var(--danger); font-size: 12px; margin-top: 12px; min-height: 16px; font-weight: 700; }

    /* ===== 登录页底部像素装饰（固定页脚，通栏铺满，黑白灰主色调）===== */
    .grave-decor {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      user-select: none;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .decor-stage {
      width: 100%;
      max-width: 1400px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 8px;
    }
    .tree { display: flex; flex-direction: column; align-items: center; }
    .tree .crown { display: flex; flex-direction: column; align-items: center; }
    .tree .crown-row { display: flex; }
    .tree .crown-row span { width: 12px; height: 12px; }
    .c-trunk { width: 16px; height: 44px; background: #2a2a2a; }

    .garden { display: flex; align-items: flex-end; gap: 3px; }
    .garden .flower { display: flex; flex-direction: column; align-items: center; }
    .garden .flower .stem { width: 4px; background: #4a4a4a; }
    .garden .flower .head { background: #9e9e9e; }
    .grass { width: 5px; background: #555555; }
    .rock { width: 14px; height: 8px; background: #6b6b6b; }

    .candles { display: flex; align-items: flex-end; gap: 8px; }
    .candle { display: flex; flex-direction: column; align-items: center; }
    .candle .flame {
      width: 6px; height: 10px; background: #f5f5f5; margin-bottom: 1px;
      animation: flicker 0.35s steps(2) infinite;
    }
    .candle .wax { width: 10px; height: 16px; background: #d9d9d9; }
    .candle .base { width: 16px; height: 4px; background: #1a1a1a; }
    .candle:nth-child(2n) .flame { animation-delay: 0.15s; }
    .candle:nth-child(3n) .flame { animation-delay: 0.28s; }

    .tree .twinkle {
      width: 6px; height: 6px; background: #f5f5f5;
      animation: twinkle 1.6s steps(1) infinite;
    }
    .tree .twinkle.b { animation-delay: 0.8s; }

    @keyframes flicker {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.7); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .candle .flame, .tree .twinkle { animation: none; }
    }

    /* ===== 首页灵堂布局 ===== */
    .shrine {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 40px 20px 80px;
    }
    /* 顶部横白布 */
    .shrine .top-cloth {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 120px;
      display: flex;
      justify-content: space-between;
      padding: 0 40px;
      pointer-events: none;
    }
    .shrine .cloth-panel {
      width: 28%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .shrine .cloth-panel .line { width: 100%; height: 8px; background: #e8e8e8; }
    .shrine .cloth-panel .line.dark { background: #cfcfcf; }
    /* 两侧白布垂幔 */
    .shrine .curtain {
      position: absolute;
      top: 0; bottom: 0;
      width: 46px;
      display: flex;
      flex-direction: column;
    }
    .shrine .curtain.left { left: 24px; }
    .shrine .curtain.right { right: 24px; }
    .shrine .curtain span { width: 100%; height: 22px; background: #ececec; margin-bottom: 3px; }
    .shrine .curtain span:nth-child(2n) { background: #dedede; }
    /* 奠字 */
    .shrine .dian {
      font-family: "Songti SC", "SimSun", "STSong", serif;
      font-size: 180px;
      font-weight: 900;
      line-height: 1;
      color: #1a1a1a;
      letter-spacing: 0;
      animation: dian-breathe 2.4s steps(2) infinite;
    }
    @keyframes dian-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.82; }
    }
    /* 灵位底座 */
    .shrine .altar {
      margin-top: 10px;
      width: 320px;
      height: 14px;
      background: #3a3a3a;
      border-radius: 3px;
    }
    .shrine .altar2 {
      width: 260px;
      height: 10px;
      background: #2a2a2a;
      border-radius: 3px;
      margin-top: 4px;
    }
    /* 底部蜡烛排 */
    .shrine .candle-row {
      position: absolute;
      bottom: 24px;
      display: flex;
      gap: 30px;
    }
    .shrine .candle-row .candle .flame { width: 10px; height: 16px; }
    .shrine .candle-row .candle .wax { width: 16px; height: 26px; background: #e8e8e8; }
    .shrine .candle-row .candle .base { width: 24px; height: 6px; background: #1a1a1a; }

    /* ===== 应用布局：左侧抽屉导航 ===== */
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; width: 20px;
      background: #1a1a1a; border-right: 1px solid var(--line);
      transition: width .18s ease; overflow: hidden; z-index: 20;
      display: flex; flex-direction: column;
    }
    .sidebar:hover { width: 220px; }
    .sidebar .tab {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #ffffff; font-size: 12px; font-weight: 600; letter-spacing: 1px;
      writing-mode: vertical-rl; white-space: nowrap; cursor: pointer; padding: 6px 0;
    }
    .sidebar:hover .tab { display: none; }
    .sidebar-inner { display: none; flex-direction: column; padding: 16px 10px; height: 100%; }
    .sidebar:hover .sidebar-inner { display: flex; }
    .sidebar .brand {
      font-size: 14px; font-weight: 700; color: #ffffff; letter-spacing: 1px;
      padding: 6px 4px 14px; border-bottom: 1px solid #3a3a3a; margin-bottom: 14px; white-space: nowrap;
    }
    .sidebar .nav-item {
      display: block; padding: 10px 12px; margin-bottom: 4px; color: #e0e0e0;
      text-decoration: none; font-weight: 500; letter-spacing: .5px;
      border-radius: 8px; white-space: nowrap; cursor: pointer;
    }
    .sidebar .nav-item:hover, .sidebar .nav-item.active { background: #3a3a3a; color: #fff; }

    .main { flex: 1; margin-left: 20px; padding: 24px 32px; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding: 14px 18px;
      background: var(--panel); border: 1px solid var(--ink);
      box-shadow: 4px 4px 0 0 #000; border-radius: 10px;
    }
    .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
    .topbar .who { font-size: 12px; color: var(--muted); margin-left: 12px; font-weight: 500; }

    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .toolbar .pixel-input { flex: 1; }

    .table-wrap {
      background: var(--panel); border: 1px solid var(--ink);
      box-shadow: 4px 4px 0 0 #000; overflow-x: auto; border-radius: 10px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #ececec; font-size: 13px; }
    th { background: #f7f7f7; font-weight: 600; letter-spacing: .5px; font-size: 12px; color: var(--muted); }
    tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) { background: #fafafa; }
    .badge { display: inline-block; padding: 2px 10px; font-size: 12px; font-weight: 500; letter-spacing: .5px; border-radius: 999px; }
    .badge.ok { background: #ececec; color: #333; }
    .badge.off { background: #f0f0f0; color: #888; }
    .badge.sys { background: #1a1a1a; color: #fff; }
    .badge.plain { background: #f0f0f0; color: #888; }
    .muted { color: #888; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .actions .pixel-btn { padding: 4px 8px; font-size: 11px; box-shadow: 2px 2px 0 0 #000; }
    .empty { padding: 48px; text-align: center; color: var(--muted); font-weight: 700; letter-spacing: 1px; }

    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center; z-index: 30;
    }
    .modal {
      background: var(--panel); border: 1px solid var(--ink);
      box-shadow: 6px 6px 0 0 #000; padding: 26px; width: 500px; max-width: 94vw;
      max-height: 90vh; overflow-y: auto; border-radius: 12px;
    }
    .modal h2 { font-size: 16px; font-weight: 700; letter-spacing: .5px; margin-bottom: 18px; }
    .modal .field { margin-bottom: 14px; }
    .modal .row { display: flex; gap: 12px; }
    .modal .row .field { flex: 1; }
    .modal .modal-btns { display: flex; gap: 10px; margin-top: 8px; }
    .modal .modal-btns .pixel-btn { flex: 1; }
    .preview-modal { width: 480px; }
    .preview-box {
      border: 2px dashed var(--ink); border-radius: 10px; overflow: hidden;
      background: #f5f5f5; display: flex; align-items: center; justify-content: center;
      min-height: 220px; margin-bottom: 12px; padding: 12px;
    }
    .preview-box img { max-width: 100%; max-height: 320px; display: block; border-radius: 6px; }
    .preview-tip {
      font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 12px; font-weight: 500;
    }

    /* 遗照选择（+号框 + 弹框网格） */
    .portrait-pick-row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .portrait-pick {
      width: 72px; height: 72px; border: 2px dashed var(--ink); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      background: #f5f5f5; overflow: hidden; transition: border-color .15s;
    }
    .portrait-pick:hover { border-color: var(--primary); }
    .portrait-pick img { width: 100%; height: 100%; object-fit: cover; }
    .portrait-pick svg { width: 100%; height: 100%; }
    .pick-plus { font-size: 32px; color: var(--muted); font-weight: 400; line-height: 1; }
    .picker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }
    .picker-cell {
      border: 2px solid transparent; border-radius: 8px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; padding: 6px;
      transition: border-color .15s;
    }
    .picker-cell:hover { border-color: var(--primary); }
    .picker-cell img, .picker-cell svg { width: 100%; height: 64px; object-fit: cover; border-radius: 6px; }
    .picker-id { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 500; }

    /* ===== 遗像网格 ===== */
    .portrait-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .portrait-cell {
      background: var(--panel); border: 1px solid var(--ink);
      box-shadow: 4px 4px 0 0 #000; border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .portrait-cell .thumb {
      width: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center;
      justify-content: center; background: #ececec; overflow: hidden;
    }
    .portrait-cell .thumb img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    .portrait-cell .meta { padding: 10px 12px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    .portrait-cell .meta .pid { font-weight: 700; color: var(--ink); }
    .portrait-cell .cell-actions { padding: 0 12px 12px; }
    .portrait-cell .cell-actions .pixel-btn { width: 100%; font-size: 12px; box-shadow: 2px 2px 0 0 #000; }

    /* ===== 遗体卡片墙 ===== */
    .remain-wall { display: grid; grid-template-columns: repeat(10, 1fr); gap: 14px; }
    @media (max-width: 1400px) { .remain-wall { grid-template-columns: repeat(8, 1fr); } }
    @media (max-width: 1100px) { .remain-wall { grid-template-columns: repeat(6, 1fr); } }
    @media (max-width: 800px)  { .remain-wall { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 520px)  { .remain-wall { grid-template-columns: repeat(2, 1fr); } }
    .remain-card {
      background: var(--panel); border: 1px solid var(--ink);
      box-shadow: 3px 3px 0 0 #000; border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column; transition: transform .05s;
    }
    .remain-card:hover { transform: translate(-1px, -1px); }
    .remain-card .avatar {
      width: 100%; aspect-ratio: 1 / 1; background: #ececec;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .remain-card .avatar img, .remain-card .avatar svg { width: 100%; height: 100%; object-fit: cover; }
    .remain-card .info { padding: 10px; font-size: 12px; }
    .remain-card .info .name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .remain-card .info .line { color: var(--muted); display: flex; justify-content: space-between; gap: 4px; flex-wrap: wrap; }
    .remain-card .card-actions { padding: 0 10px 10px; display: flex; gap: 6px; }
    .remain-card .card-actions .pixel-btn { flex: 1; font-size: 11px; padding: 4px 6px; box-shadow: 2px 2px 0 0 #000; }

    .portrait-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .portrait-picker .opt {
      width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 6px;
      cursor: pointer; overflow: hidden; position: relative;
    }
    .portrait-picker .opt img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    .portrait-picker .opt.active { border: 2px solid var(--primary); box-shadow: 2px 2px 0 0 #000; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const { createApp, reactive, ref, computed, onMounted } = Vue;

    const API_URL = "https://test-d2g8lzeup3f63654a-1253559338.ap-shanghai.app.tcloudbase.com/api/data";

    // 默认灰色半身卡通形象（内联 SVG）
    const DEFAULT_AVATAR_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="crispEdges"><rect width="100" height="100" fill="#e6e6e6"/><rect x="34" y="10" width="32" height="6" fill="#a8a8a8"/><rect x="30" y="13" width="4" height="26" fill="#a8a8a8"/><rect x="66" y="13" width="4" height="26" fill="#a8a8a8"/><rect x="38" y="18" width="24" height="22" fill="#c9c9c9"/><rect x="42" y="26" width="4" height="4" fill="#7a7a7a"/><rect x="54" y="26" width="4" height="4" fill="#7a7a7a"/><rect x="46" y="35" width="8" height="5" fill="#7a7a7a"/><rect x="34" y="44" width="32" height="30" fill="#c9c9c9"/><rect x="30" y="46" width="40" height="6" fill="#b5b5b5"/></svg>`;

    async function sha256Hex(str) {
      const data = new TextEncoder().encode(str);
      const buf = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    const CALL_FN = async (data) => {
      const res = await fetch(API_URL, {
        method: "POST",

    const ImageUtil = {
      MAX_EDGE: 800,
      MAX_BYTES: 5 * 1024 * 1024,

      // 读取原图，返回彩色预览 dataURL（不处理压缩/灰度）
      async readPreview(file) {
        if (file.size > this.MAX_BYTES) throw new Error("图片不能超过 5MB");
        let bmp;
        try {
          bmp = await createImageBitmap(file);
        } catch (e) {
          bmp = await this._loadViaImage(file);
        }
        try {
          const canvas = document.createElement("canvas");
          canvas.width = bmp.width; canvas.height = bmp.height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(bmp, 0, 0);
          return canvas.toDataURL("image/jpeg", 0.9);
        } finally {
          if (bmp && bmp.close) bmp.close();
        }
      },

      async toGrayscale(file) {
        if (file.size > this.MAX_BYTES) throw new Error("图片不能超过 5MB");
        let bmp;
        try {
          bmp = await createImageBitmap(file);
        } catch (e) {
          // 降级：用 Image + objectURL
          bmp = await this._loadViaImage(file);
        }
        try {
          let w = bmp.width, h = bmp.height;
          let scale = 1;
          const maxEdge = Math.max(w, h);
          if (maxEdge > this.MAX_EDGE) scale = this.MAX_EDGE / maxEdge;
          const tw = Math.max(1, Math.round(w * scale));
          const th = Math.max(1, Math.round(h * scale));

          const canvas = document.createElement("canvas");
          canvas.width = tw; canvas.height = th;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(bmp, 0, 0, tw, th);

          const imageData = ctx.getImageData(0, 0, tw, th);
          const px = imageData.data;
          for (let i = 0; i < px.length; i += 4) {
            const gray = Math.round(0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]);
            px[i] = gray; px[i + 1] = gray; px[i + 2] = gray;
          }
          ctx.putImageData(imageData, 0, 0);

          const dataURL = canvas.toDataURL("image/jpeg", 0.7);
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.7));
          const size = blob ? blob.size : Math.round((dataURL.length - dataURL.indexOf(",") - 1) * 0.75);
          if (size > this.MAX_BYTES) throw new Error("处理后图片仍超过 5MB，请更换更小的图片");
          return { dataURL, width: tw, height: th, size };
        } finally {
          if (bmp && bmp.close) bmp.close();
        }
      },

      _loadViaImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => { resolve(img); };
          img.onerror = (e) => { URL.revokeObjectURL(url); reject(new Error("图片加载失败")); };
          img.src = url;
        });

        const graying = ref(false);
        const saving = ref(false);
        const grayResult = ref(null);

        const fmtSize = (n) => {
          n = Number(n) || 0;
          if (n < 1024) return n + " B";
          if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
          return (n / 1024 / 1024).toFixed(2) + " MB";
        };

        const load = async () => {
          try { rows.value = await CALL_FN({ action: "listPortraits", token: props.token }); }
          catch (e) { alert(e.message); }
        };

        const triggerUpload = () => { if (fileInput.value) fileInput.value.click(); };

        const onFileChange = async (evt) => {
          const file = evt.target.files && evt.target.files[0];
          evt.target.value = "";
          if (!file) return;
          if (file.size > 5 * 1024 * 1024) { alert("图片不能超过 5MB"); return; }
          try {
            // 第一步：只读取原图预览，不转黑白
            const preview = await ImageUtil.readPreview(file);
            previewFile.value = file;
            previewSrc.value = preview;
            grayed.value = false;
            grayResult.value = null;
            showPreview.value = true;
          } catch (e) { alert(e.message); }
        };

        const applyGray = async () => {
          if (!previewFile.value) return;
          graying.value = true;
          try {
            const res = await ImageUtil.toGrayscale(previewFile.value);
            grayResult.value = res;
            previewSrc.value = res.dataURL;
            grayed.value = true;
          } catch (e) { alert(e.message); }
          finally { graying.value = false; }
        };

        const save = async () => {
          if (!grayResult.value) return;
          saving.value = true;
          try {
            const r = grayResult.value;
            await CALL_FN({
              action: "uploadPortrait",
              token: props.token,
              data: { image: r.dataURL, width: r.width, height: r.height, size: r.size },
            });
            showPreview.value = false;
            await load();
          } catch (e) { alert(e.message); }
          finally { saving.value = false; }
        };

        const del = async (p) => {
          if (!confirm(`确定删除遗像 #${p._id}？将删除云存储文件，被引用的遗体将恢复为默认灰色卡通形象。`)) return;
          try { await CALL_FN({ action: "deletePortrait", token: props.token, id: p._id }); load(); }
          catch (e) { alert(e.message); }
        };

        onMounted(load);
        return {
          rows, uploading, fileInput, dummyDataURL, fmtSize, load,
          showPreview, previewSrc, grayed, graying, saving, applyGray, save,
          triggerUpload, onFileChange, del,
        };

              <h2>{{ editing ? '修改司机' : '新增司机' }}</h2>
              <div class="field"><label class="pixel-label">姓名 *</label>
                <input class="pixel-input" v-model.trim="form.name" placeholder="必填" /></div>
              <div class="field"><label class="pixel-label">员工工号 *</label>
                <input class="pixel-input" v-model.trim="form.employee_no" placeholder="必填，唯一" /></div>
              <div class="field"><label class="pixel-label">身份证号</label>
                <input class="pixel-input" v-model.trim="form.id_card" placeholder="选填" /></div>
              <div class="field"><label class="pixel-label">性别</label>
                <select class="pixel-input" v-model="form.gender">
                  <option value="">— 请选择 —</option>
                  <option value="男">男</option>
                  <option value="女">女</option>
                </select></div>
              <div class="field"><label class="pixel-label">出生日期</label>
                <input class="pixel-input" type="date" v-model="form.birth_date" /></div>
              <div class="field"><label class="pixel-label">年龄</label>
                <input class="pixel-input" :value="computedAge" disabled placeholder="由出生日期自动计算" /></div>
              <div class="field"><label class="pixel-label">联系电话</label>
                <input class="pixel-input" v-model.trim="form.phone" placeholder="选填" /></div>
              <div class="field"><label class="pixel-label">驾驶证号</label>
                <input class="pixel-input" v-model.trim="form.license_no" placeholder="选填" /></div>
              <div class="field"><label class="pixel-label">准驾车型</label>
                <input class="pixel-input" v-model.trim="form.license_type" placeholder="选填" /></div>
              <div class="field"><label class="pixel-label">驾驶证到期日</label>
                <input class="pixel-input" type="date" v-model="form.license_expiry" /></div>
              <div class="field"><label class="pixel-label">当前状态</label>
                <select class="pixel-input" v-model="form.status">
                  <option value="在岗">在岗</option>
                  <option value="休假">休假</option>
                  <option value="停用">停用</option>
                  <option value="离职">离职</option>
                </select></div>
              <div class="field"><label class="pixel-label">入职日期</label>
                <input class="pixel-input" type="date" v-model="form.hire_date" /></div>
              <div class="modal-btns">
                <button class="pixel-btn primary" @click="save">保存</button>
                <button class="pixel-btn ghost" @click="showModal=false">取消</button>
              </div>
            </div>
          </div>
        </div>`,
      setup(props) {
        const rows = ref([]);
        const keyword = ref("");
        const showModal = ref(false);
        const editing = ref(false);
        const editId = ref(null);
        const form = reactive({
          name: "", employee_no: "", id_card: "", gender: "", birth_date: "",
          phone: "", license_no: "", license_type: "", license_expiry: "", status: "在岗", hire_date: "",
        });

        const statusClass = (s) => {
          if (s === "在岗") return "ok";
          if (s === "休假") return "warn";
          if (s === "停用") return "off";
          return "off";
        };

        // 年龄实时预览（周岁）
        const computedAge = computed(() => {
          const bd = form.birth_date;
          if (!bd) return "";
          const [y, m, d] = bd.split("-").map(Number);
          const now = new Date();
          let age = now.getFullYear() - y;
          const mDiff = now.getMonth() + 1 - m;
          if (mDiff < 0 || (mDiff === 0 && now.getDate() < d)) age--;
          return age < 0 ? 0 : age;
        });

        const load = async () => {
          try {
            rows.value = await CALL_FN({ action: "listDrivers", token: props.token, keyword: keyword.value });
          } catch (e) { alert(e.message); }
        };

        const resetForm = () => {
          form.name = ""; form.employee_no = ""; form.id_card = ""; form.gender = "";
          form.birth_date = ""; form.phone = ""; form.license_no = ""; form.license_type = "";
          form.license_expiry = ""; form.status = "在岗"; form.hire_date = "";
        };

        const openCreate = () => { editing.value = false; editId.value = null; resetForm(); showModal.value = true; };
        const openEdit = (r) => {
          editing.value = true; editId.value = r._id;
          form.name = r.name;
          form.employee_no = r.employee_no;
          form.id_card = r.id_card;
          form.gender = r.gender;
          form.birth_date = r.birth_date;
          form.phone = r.phone;
          form.license_no = r.license_no;
          form.license_type = r.license_type;
          form.license_expiry = r.license_expiry;
          form.status = r.status;
          form.hire_date = r.hire_date;
          showModal.value = true;
        };

        const save = async () => {
          if (!form.name) { alert("姓名不能为空"); return; }
          if (!form.employee_no) { alert("员工工号不能为空"); return; }
          const data = {
            name: form.name,
            employee_no: form.employee_no,
            id_card: form.id_card,
            gender: form.gender,
            birth_date: form.birth_date,
            phone: form.phone,
            license_no: form.license_no,
            license_type: form.license_type,
            license_expiry: form.license_expiry,
            status: form.status,
            hire_date: form.hire_date,
          };
          try {
            if (editing.value) {
              await CALL_FN({ action: "updateDriver", token: props.token, id: editId.value, data });
            } else {
              await CALL_FN({ action: "createDriver", token: props.token, data });
            }
            showModal.value = false;
            load();
          } catch (e) { alert(e.message); }
        };

        const del = async (r) => {
          if (!confirm(`确定删除司机「${r.name}」？此操作不可恢复。`)) return;
          try { await CALL_FN({ action: "deleteDriver", token: props.token, id: r._id }); load(); }
          catch (e) { alert(e.message); }
        };

        onMounted(load);
        return { rows, keyword, showModal, editing, form, statusClass, computedAge, load, openCreate, openEdit, save, del };
      },
    };

    // ===== 开发者日志页 =====
    const DevLogManage = {
      props: ["token"],
      template: `
        <div>
          <div class="toolbar">
            <button class="pixel-btn primary" @click="openCreate">＋ 新增日志</button>
          </div>
          <div v-if="rows.length" class="table-wrap">
            <table>
              <thead><tr><th>开发人员</th><th>发布时间</th><th>更新内容</th></tr></thead>
              <tbody>
                <tr v-for="r in rows" :key="r._id">
                  <td style="font-weight:700">{{ r.developer }}</td>
                  <td>{{ r.publish_date }}</td>
                  <td style="white-space:pre-wrap">{{ r.content }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-else class="empty" style="background:#fff;border:1px solid var(--ink);box-shadow:4px 4px 0 0 #000;border-radius:10px">暂无日志，点击「新增日志」开始</div>

          <div v-if="showModal" class="modal-mask" @click.self="showModal=false">
            <div class="modal">
              <h2>新增日志</h2>
              <div class="field"><label class="pixel-label">开发人员 *</label>
                <input class="pixel-input" v-model.trim="form.developer" placeholder="必填" /></div>
              <div class="field"><label class="pixel-label">发布时间 *</label>
                <input class="pixel-input" type="date" v-model="form.publish_date" /></div>
              <div class="field"><label class="pixel-label">更新内容 *</label>
                <textarea class="pixel-input" v-model.trim="form.content" rows="5" placeholder="必填"></textarea></div>
              <div class="modal-btns">
                <button class="pixel-btn primary" @click="save">保存</button>
                <button class="pixel-btn ghost" @click="showModal=false">取消</button>
              </div>
            </div>
          </div>
        </div>`,
      setup(props) {
        const rows = ref([]);
        const showModal = ref(false);
        const form = reactive({ developer: "", publish_date: "", content: "" });

        // 默认发布时间 = 今天
        const todayStr = () => {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          return `${y}-${m}-${day}`;
        };

        const load = async () => {
          try { rows.value = await CALL_FN({ action: "listDevLogs", token: props.token }); }
          catch (e) { alert(e.message); }
        };
        const openCreate = () => {
          form.developer = ""; form.content = "";
          form.publish_date = todayStr();
          showModal.value = true;
        };
        const save = async () => {
          if (!form.developer) { alert("请填写开发人员"); return; }
          if (!form.publish_date) { alert("请选择发布时间"); return; }
          if (!form.content) { alert("请填写更新内容"); return; }
          try {
            await CALL_FN({
              action: "createDevLog", token: props.token,
              data: { developer: form.developer, publish_date: form.publish_date, content: form.content },
            });
            showModal.value = false;
            load();
          } catch (e) { alert(e.message); }
        };

        onMounted(load);
        return { rows, showModal, form, openCreate, save };
      },
    };

    // ===== 灵车预约（看板）=====
    const ResManage = {
      props: ["token"],
      template: `
        <div>
          <div class="toolbar">
            <button class="pixel-btn" @click="shiftWeek(-7)">‹ 上一周</button>
            <span class="board-title">{{ rangeLabel }}</span>
            <button class="pixel-btn" @click="shiftWeek(7)">下一周 ›</button>
            <button class="pixel-btn ghost" @click="goToday">回到今天</button>
            <button class="pixel-btn primary" @click="openCreate">＋ 新增预约</button>
          </div>

          <!-- 车辆 × 日期矩阵看板 -->
          <div class="board-wrap">
            <table class="board">
              <thead>
                <tr>
                  <th class="corner">车辆 \\ 日期</th>
                  <th v-for="d in days" :key="d.key" :class="{today: d.isToday}">
                    <div class="d-week">{{ d.week }}</div>
                    <div class="d-day">{{ d.day }}</div>
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="h in hearseRows" :key="h._id">
                  <td class="h-name">
                    <div class="h-plate">{{ h.plate_number }}</div>
                    <div class="h-model">{{ h.vehicle_model }}</div>
                  </td>
                  <td v-for="d in days" :key="d.key" :class="{today: d.isToday}">
                    <div v-if="cellOf(h._id, d.key)" class="cell-booked" :title="cellTip(h._id, d.key)">
                      {{ cellOf(h._id, d.key).booker }}
                    </div>
                    <div v-else class="cell-empty"></div>
                  </td>
                </tr>
              </tbody>
            </table>
            <div v-if="!hearseRows.length" class="empty" style="background:#fff;border:1px solid var(--ink);box-shadow:4px 4px 0 0 #000;border-radius:10px;margin-top:12px">暂无灵车档案，请先添加灵车</div>
          </div>

          <!-- 预约清单 -->
          <div class="res-list-title">预约明细</div>
          <div v-if="resRows.length" class="table-wrap">
            <table>
              <thead><tr><th>车牌号</th><th>车辆型号</th><th>司机</th><th>开始日期</th><th>结束日期</th><th>预约人</th><th>电话</th><th>操作</th></tr></thead>
              <tbody>
                <tr v-for="r in resRows" :key="r._id">
                  <td style="font-weight:700">{{ r.plate_number }}</td>
                  <td>{{ r.vehicle_model || '—' }}</td>
                  <td>{{ r.driver_name || '—' }}</td>
                  <td>{{ r.start_date }}</td>
                  <td>{{ r.end_date }}</td>
                  <td>{{ r.booker }}</td>
                  <td>{{ r.phone || '—' }}</td>
                  <td><button class="pixel-btn mini danger" @click="cancel(r)">取消</button></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div v-else class="empty" style="background:#fff;border:1px solid var(--ink);box-shadow:4px 4px 0 0 #000;border-radius:10px;margin-top:12px">暂无预约</div>

          <!-- 新增预约弹窗 -->
          <div v-if="showModal" class="modal-mask" @click.self="showModal=false">
            <div class="modal">
              <h2>新增预约</h2>
              <div class="field"><label class="pixel-label">预约车辆 *</label>
                <select class="pixel-input" v-model.number="form.hearse_id">
                  <option :value="0">— 请选择车辆 —</option>
                  <option v-for="h in availableHearses" :key="h._id" :value="Number(h._id)">{{ h.plate_number }}（{{ h.vehicle_model }}）</option>
                </select></div>
              <div class="field"><label class="pixel-label">关联司机</label>
                <select class="pixel-input" v-model.number="form.driver_id">
                  <option :value="0">— 不选司机 —</option>
                  <option v-for="drv in availableDrivers" :key="drv._id" :value="Number(drv._id)">{{ drv.name }}（{{ drv.employee_no }}）</option>
                </select></div>
              <div class="field"><label class="pixel-label">预约开始日期 *</label>
                <input class="pixel-input" type="date" v-model="form.start_date" /></div>
              <div class="field"><label class="pixel-label">预约结束日期 *</label>
                <input class="pixel-input" type="date" v-model="form.end_date" /></div>
              <div class="field"><label class="pixel-label">预约人 *</label>
                <input class="pixel-input" v-model.trim="form.booker" placeholder="必填" /></div>
              <div class="field"><label class="pixel-label">联系电话</label>
                <input class="pixel-input" v-model.trim="form.phone" placeholder="选填" /></div>
              <div class="modal-btns">
                <button class="pixel-btn primary" @click="save">保存</button>
                <button class="pixel-btn ghost" @click="showModal=false">取消</button>
              </div>
            </div>
          </div>
        </div>`,
      setup(props) {
        const hearseRows = ref([]);
        const resRows = ref([]);
        const showModal = ref(false);
        const weekOffset = ref(0); // 相对本周的偏移天数

        const form = reactive({
          hearse_id: 0, driver_id: 0, start_date: "", end_date: "", booker: "", phone: "",
        });

        // 本周一零点的日期对象
        const mondayOfWeek = (offsetDays) => {
          const now = new Date();
          const day = now.getDay(); // 0=周日
          const diff = day === 0 ? -6 : 1 - day; // 周一
          const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff + offsetDays);
          return monday;
        };

        const fmt = (d) => {
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          return `${y}-${m}-${day}`;
        };

        const WEEK_CN = ["日", "一", "二", "三", "四", "五", "六"];

        // 本周 7 天（周一~周日）
        const days = computed(() => {
          const monday = mondayOfWeek(weekOffset.value);
          const arr = [];
          for (let i = 0; i < 7; i++) {
            const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
            const key = fmt(d);
            arr.push({
              key,
              day: d.getDate(),
              month: d.getMonth() + 1,
              week: WEEK_CN[d.getDay()],
              isToday: key === fmt(new Date()),
            });
          }
          return arr;
        });

        const rangeLabel = computed(() => {
          const d = days.value;
          return `${d[0].month}/${d[0].day} ~ ${d[6].month}/${d[6].day}`;
        });

        // 只展示「可用」的车辆作为看板行
        const availableHearses = computed(() =>
          hearseRows.value.filter((h) => h.status === "可用")
        );
        const availableDrivers = ref([]);

        // 某车某天是否被预约（返回预约对象或 null）
        const cellOf = (hearseId, dayKey) => {
          // 处理 NUMERIC：dayKey 已是 "YYYY-MM-DD"
          const found = resRows.value.find((r) =>
            String(r.hearse_id) === String(hearseId) &&
            r.start_date <= dayKey && r.end_date >= dayKey
          );
          return found || null;
        };
        const cellTip = (hearseId, dayKey) => {
          const r = cellOf(hearseId, dayKey);
          if (!r) return "";
          return `${r.booker}（${r.driver_name || "无司机"}）${r.start_date}~${r.end_date}`;
        };

        const load = async () => {
          try {
            hearseRows.value = await CALL_FN({ action: "listHearses", token: props.token });
            resRows.value = await CALL_FN({ action: "listReservations", token: props.token });
            availableDrivers.value = await CALL_FN({ action: "listDrivers", token: props.token });
            // 司机只显示「在岗」
            availableDrivers.value = availableDrivers.value.filter((d) => d.status === "在岗");
          } catch (e) { alert(e.message); }
        };

        const shiftWeek = (n) => { weekOffset.value += n; };
        const goToday = () => { weekOffset.value = 0; };

        const openCreate = () => {
          form.hearse_id = 0; form.driver_id = 0; form.booker = ""; form.phone = "";
          // 默认预约日期 = 今天
          form.start_date = fmt(new Date());
          form.end_date = fmt(new Date());
          showModal.value = true;
        };

        const save = async () => {
          if (!form.hearse_id) { alert("请选择预约车辆"); return; }
          if (!form.start_date) { alert("请选择预约开始日期"); return; }
          if (!form.end_date) { alert("请选择预约结束日期"); return; }
          if (form.start_date > form.end_date) { alert("结束日期不能早于开始日期"); return; }
          if (!form.booker) { alert("请填写预约人"); return; }
          try {
            await CALL_FN({
              action: "createReservation", token: props.token,
              data: {
                hearse_id: form.hearse_id,
                driver_id: form.driver_id || null,
                start_date: form.start_date,
                end_date: form.end_date,
                booker: form.booker,
                phone: form.phone,
              },
            });
            showModal.value = false;
            load();
          } catch (e) { alert(e.message); }
        };

        const cancel = async (r) => {
          if (!confirm(`确定取消预约「${r.plate_number} ${r.start_date}~${r.end_date} 预约人：${r.booker}」？`)) return;
          try { await CALL_FN({ action: "cancelReservation", token: props.token, id: r._id }); load(); }
          catch (e) { alert(e.message); }
        };

        onMounted(load);
        return {
          hearseRows, availableHearses, resRows, days, rangeLabel, cellOf, cellTip,
          showModal, form, availableDrivers, load, shiftWeek, goToday, openCreate, save, cancel,
        };
      },
    };

    // ===== 根组件 =====
    const Root = {
      components: { LoginPage, AppShell, HomePage, UserManage, PortraitManage, RemainManage, HearseManage, DriverManage, ResManage, DevLogManage },
      data() {
        return {
          token: localStorage.getItem("token") || "",
          username: localStorage.getItem("username") || "",
          page: "home",
        };
      },
      computed: {
        who() { return this.username; },
        activeComponent() {
          if (this.page === "portrait") return "portrait-manage";
          if (this.page === "remain") return "remain-manage";
          if (this.page === "hearse") return "hearse-manage";
          if (this.page === "driver") return "driver-manage";
          if (this.page === "res") return "res-manage";
          if (this.page === "user") return "user-manage";
          if (this.page === "devlog") return "dev-log-manage";
          return "home-page";
        },
      },
      methods: {
        onLogin(t, name) {
          this.token = t; this.username = name;
          localStorage.setItem("token", t); localStorage.setItem("username", name);
          this.page = "home";
        },
        onLogout() {
          this.token = ""; this.username = "";
          localStorage.removeItem("token"); localStorage.removeItem("username");
          this.page = "home";
        },
        changePage(p) { this.page = p; },
      },
      template: `
        <login-page v-if="!token" @login="onLogin"></login-page>
        <app-shell v-else :token="token" :who="who" :page="page" @change-page="changePage" @logout="onLogout">
          <component :is="activeComponent" :token="token" :who="who"></component>
        </app-shell>`,
    };

    createApp(Root).mount("#app");
  </script>
</body>
</html>
